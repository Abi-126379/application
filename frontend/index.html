<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registration</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="card">
  <div class="tabs">
    <button class="tab-btn active" data-tab="register">Register</button>
    <button class="tab-btn" data-tab="login">Log in</button>
  </div>

  <!-- REGISTER FORM -->
  <form id="registerForm" class="panel active" novalidate>
    <h1>Create your account</h1>
    <p class="subtitle">Fill in your details below.</p>

    <label for="reg-name">Full name</label>
    <input type="text" id="reg-name" name="name" placeholder="Jane Doe" required />
    <span class="error" data-for="reg-name"></span>

    <label for="reg-mobile">Mobile number</label>
    <input type="tel" id="reg-mobile" name="mobile_no" placeholder="9876543210" required />
    <span class="error" data-for="reg-mobile"></span>

    <label for="reg-email">Email</label>
    <input type="email" id="reg-email" name="email" placeholder="jane@example.com" required />
    <span class="error" data-for="reg-email"></span>

    <label for="reg-address">Address</label>
    <textarea id="reg-address" name="address" rows="3" placeholder="Street, city, state, PIN"></textarea>
    <span class="error" data-for="reg-address"></span>

    <label for="reg-password">Password</label>
    <input type="password" id="reg-password" name="password" placeholder="At least 6 characters" required />
    <span class="error" data-for="reg-password"></span>

    <button type="submit">Create account</button>
    <p class="form-message" id="registerMessage"></p>
  </form>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="panel" novalidate>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in with your email and password.</p>

    <label for="login-email">Email</label>
    <input type="email" id="login-email" name="email" placeholder="jane@example.com" required />
    <span class="error" data-for="login-email"></span>

    <label for="login-password">Password</label>
    <input type="password" id="login-password" name="password" placeholder="Your password" required />
    <span class="error" data-for="login-password"></span>

    <button type="submit">Log in</button>
    <p class="form-message" id="loginMessage"></p>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
